<!DOCTYPE html><html lang="en"><head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Global Dating Chat - Connect with people worldwide">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Global Dating Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Global Dating Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFBFE;
    }
    .web-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #9400D3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(148,0,211,0.3);
    }
    .web-nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .web-nav a:hover, .web-nav a.active {
      background: rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }
    .flutter-container {
      margin-top: 60px;
    }
    @media (max-width: 768px) {
      .web-nav {
        display: none;
      }
      .flutter-container {
        margin-top: 0;
      }
    }
  </style>
  
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
<body>
  <div class="web-nav">
    <a href="/home.html" class="active">Home</a>
    <a href="/home.html">Open App</a>
  </div>
  
  <div class="flutter-container">
    <script>
      window.addEventListener('load', function(ev) {
        _flutter.loader.load({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      });
    </script>
    <script src="flutter.js" defer=""></script>
  </div>

</body></html>
